name: Nasdaq Sentinel Cloud

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 13-21 * * 1-5"

permissions:
  contents: write

concurrency:
  group: nasdaq-sentinel-cloud
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Show execution type
        run: echo "Execution type $GITHUB_EVENT_NAME"

      - name: Run Nasdaq Sentinel
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHAT_ID_HIJO: ${{ secrets.TELEGRAM_CHAT_ID_HIJO }}
        run: python bot_cloud.py

      - name: Save state and signals
        run: |
          git config user.name "Nasdaq Sentinel Cloud"
          git config user.email "actions@users.noreply.github.com"

          git add estado_cloud.json senales_simuladas.csv 2>/dev/null || true

          if ! git diff --cached --quiet; then
            git commit -m "Actualizar el estado de Nasdaq Sentinel"
            git pull --rebase
            git push
          fi
